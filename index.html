    else if (q.t === 'tf') body = pm.map(function (o, j) { var v = r.a ? r.a[o] : null, kv = r.x.k[o]; return '<div class="det-opt' + (v == null ? '' : v === kv ? ' k' : ' x') + '"><b>' + abcd[j] + ')</b><span class="q">' + (q.s[o] || '') + '</span><span style="margin-left:auto;white-space:nowrap">Em: <b>' + (v === 1 ? 'Đ' : v === 0 ? 'S' : '–') + '</b> · Đáp án: <b class="ok">' + (kv === 1 ? 'Đúng' : 'Sai') + '</b></span></div>'; }).join('') + '<p class="hint">Đúng ' + r.n + '/4 ý → ' + vn(r.pt) + ' điểm</p>';
    else body = '<div class="det-opt ' + (r.ok ? 'k' : 'x') + '">Em trả lời: <b>' + esc(r.a || '–') + '</b> · Đáp án: <b class="ok">' + esc(r.x.k) + '</b></div>';
    show(head() + '<div class="card"><div class="qh"><span class="pill">Câu ' + (k + 1) + ' · ' + vn(r.pt) + '/' + vn(r.mx) + ' điểm</span><b class="' + (r.ok ? 'ok' : 'no') + '">' + (r.ok ? '✓ Đúng' : '✗ Chưa đúng') + '</b></div><div class="q">' + q.c + '</div>' + body +
      (r.x.sol ? '<div class="sol"><div class="sol-h">Lời giải chi tiết</div><div class="q">' + r.x.sol + '</div></div>' : '<p class="hint">Câu này chưa có lời giải chi tiết.</p>') + '<button class="pri big" id="rb">← Quay lại Bảng điểm</button></div>');
    document.getElementById('rb').onclick = function () { st.view = null; save(); result(); };
  }
  document.addEventListener('visibilitychange', function () { if (!D.tabWarn || !st || st.done || !st.start || !document.hidden) return; st.warn++; save(); banner = 'Em vừa rời khỏi trang làm bài (' + st.warn + ' lần). Việc này được ghi lại trong bài làm.'; });
  document.addEventListener('fullscreenchange', function () { if (!D.fullscreen || !st || st.done || document.fullscreenElement) return; st.warn++; save(); banner = 'Em đã thoát chế độ toàn màn hình (' + st.warn + ' lần). <button onclick="document.documentElement.requestFullscreen()">Vào lại toàn màn hình</button>'; exam(); });
  if (!st) start(); else if (st.done) { st.view = null; if (D.sub && !st.sent) send(); result(); } else if (left() <= 0) submit(true); else exam();
});</script></body></html>
